<style>
/* Layout: one calm column, app-style bottom tabs; earth palette (moss, clay, slate, ochre, rust on sand / bark). */
:root{
  --bg:#ece7dc;--surface:#f7f4ed;--surface-2:#e5dfd2;--line:#d8d0c0;
  --text:#2a2823;--muted:#756f62;--faint:#a69f90;
  --accent:#58704a;--accent-ink:#f7f4ed;--accent-soft:#dde3d2;
  --good:#58704a;--good-soft:#dde3d2;--warn:#a87a26;--warn-soft:#efe2c6;--bad:#a4492f;--bad-soft:#f0d9cf;
  --c-push:#b0613d;--c-pull:#4d6b68;--c-legs:#7b7f3e;--c-ca:#b98d3c;--c-cb:#8b5148;--c-x:#7a6a58;--rest:#9384ad;--rest-soft:#e6e1ee;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b17;--surface:#25231e;--surface-2:#2e2b25;--line:#3a362e;
  --text:#ebe5d8;--muted:#a69e8c;--faint:#6f6859;
  --accent:#9db384;--accent-ink:#1c1b17;--accent-soft:#2f3828;
  --good:#9db384;--good-soft:#2f3828;--warn:#d9ad5b;--warn-soft:#3b3020;--bad:#d9805f;--bad-soft:#3e271f;
  --c-push:#d4825c;--c-pull:#7fa09b;--c-legs:#aab063;--c-ca:#d9ad5b;--c-cb:#bf7c70;--c-x:#a8957e;--rest:#ab9cc8;--rest-soft:#372f47;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1b17;--surface:#25231e;--surface-2:#2e2b25;--line:#3a362e;
  --text:#ebe5d8;--muted:#a69e8c;--faint:#6f6859;
  --accent:#9db384;--accent-ink:#1c1b17;--accent-soft:#2f3828;
  --good:#9db384;--good-soft:#2f3828;--warn:#d9ad5b;--warn-soft:#3b3020;--bad:#d9805f;--bad-soft:#3e271f;
  --c-push:#d4825c;--c-pull:#7fa09b;--c-legs:#aab063;--c-ca:#d9ad5b;--c-cb:#bf7c70;--c-x:#a8957e;--rest:#ab9cc8;--rest-soft:#372f47;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 28px calc(16px + env(safe-area-inset-left,0px))}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 0 18px;flex-wrap:wrap}
header.top h1{font-size:32px;line-height:1.05;margin:0;font-weight:750}
header.top .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{margin:0;font-size:17px;font-weight:650}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;height:52px;font-size:16px;border-radius:14px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.field{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 12px;outline:none;min-height:44px;font-size:16px}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:76px}
label.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
nav.tabs{transform:translateZ(0);position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
nav.tabs button{transition:color .15s}
nav.tabs button.on{color:var(--text)}
nav.tabs svg{width:22px;height:22px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:12px;background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.wd.today{background:var(--accent-soft);color:var(--text)}
.wd .marks{display:flex;gap:3px;height:8px}
.wd .plan{font-size:10px;color:var(--faint);font-weight:600;height:13px}
.day-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px}
.badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:750;color:#fff;flex:none;font-size:17px}
.hero{padding:20px}
.hero .disp{font-size:26px;font-weight:750;margin:2px 0 4px;line-height:1.1}
.sess-head{transform:translateZ(0);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ex-head{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
.ex-title{font-family:var(--display);font-size:18px;font-weight:650;margin:0;line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.rule{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.sets{margin-top:14px;display:grid;gap:7px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 86px 42px;gap:6px;align-items:center}
.set.noW{grid-template-columns:22px minmax(0,1fr) 86px 42px}
.set.chk{grid-template-columns:22px 1fr 42px}
.set .n{font-size:12px;color:var(--faint);font-weight:700;text-align:center}
.set .x{color:var(--faint);text-align:center;font-size:13px}

<script>
"use strict";
/* ============================================================
   Lift Log: lifts, cardio, calendar and long-term progress.

const LS_KEY = "liftlog.v1";
const LS_DRAFT = "liftlog.draft.v1";
const LS_PEND = "liftlog.pending.v1";
const INTS = ["Easy", "Moderate", "Hard"];
const TAGS = {
  strength: { label: "Strength", color: "var(--c-push)" },
  physique: { label: "Physique", color: "var(--c-legs)" },
  posture: { label: "Posture", color: "var(--c-pull)" },
  accessory: { label: "Accessory", color: "var(--c-ca)" },
  calves: { label: "Calves", color: "var(--c-cb)" },
  grip: { label: "Grip", color: "var(--c-x)" },
};

const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

let _uid = 0;
const uid = (p = "x") => p + Date.now().toString(36) + (_uid++).toString(36) + Math.random().toString(36).slice(2, 6);
const M = "Moderate", E = "Easy", H = "Hard";

/* Fuller form cues for the harder lifts: [original cues it replaces, new cues, where you should feel it]. */
const CUES = {
  "Incline Barbell Bench Press": ["Feet planted|Chest up|Brace before every rep", ["Feet planted, glutes on the bench", "Shoulder blades pinched back and down", "Brace before every rep", "Bar to upper chest, wrists over elbows", "2 s down, press up and slightly back"], "Upper chest and front delts, not your neck"],
  "Seated Dumbbell Shoulder Press": ["Brace abs|Elbows slightly forward|Don't arch lower back", ["Ribs down, abs braced", "Elbows slightly forward", "Lower to chin height under control", "Press up and slightly in", "Don't arch your lower back"], "Front and side delts"],
  "Romanian Deadlift": ["Hips back|Brace first|Bar close to legs", ["Brace first, chest proud", "Soft knees, shins stay vertical", "Push hips back, bar slides down your legs", "Stop at a big hamstring stretch, back flat", "Stand up by squeezing glutes, don't lean back"], "Hamstrings and glutes, never your lower back"],
  "Neutral-Grip Lat Pulldown": ["Drive elbows to ribs|Chest tall|Control the return", ["Slight lean back, ribs down", "Drive elbows down to your ribs", "Bar to upper chest", "Full stretch at the top without shrugging"], "Lats, under your armpits"],
  "Chest-Supported Row": ["Pull with elbows|Squeeze shoulder blades|Don't shrug", ["Chest glued to the pad", "Pull with elbows, about 45° out", "Squeeze shoulder blades for 1 s", "Full reach forward each rep", "Don't shrug"], "Mid back and rear delts"],
  "Cable Face Pull": ["Rope to forehead|Elbows high|Rotate hands back", ["Cable at forehead height", "Thumbs pointing back", "Ribs down, no back arch", "Pull to your eyes: hands beside ears, elbows high", "1 s hold, 2 s return"], "Rear delts and mid back, not biceps, neck, traps or lower back"],
  "Barbell Hip Thrust": ["Chin tucked|Ribs down|Squeeze glutes", ["Bench under your shoulder blades", "Chin tucked, ribs down", "Drive through your heels", "Shins vertical at the top", "Lock out with glutes, not your lower back"], "Glutes, not your lower back or quads"],
  "Bulgarian Split Squat": ["Push through whole foot|Control the descent|Stay balanced", ["Front foot far enough that the knee tracks over the toes", "Slight forward lean", "Back leg is only for balance", "Control the descent", "Drive up through the front heel"], "Front glute and quad"],

/* ---------- default program ---------- */
function ex(name, tags, repMin, repMax, restSec, ints, cues, pause, extra = {}) {
  return Object.assign({
    id: uid("e"), name, tags, repMin, repMax, restSec,
    sets: ints.map(i => typeof i === "string" ? { int: i, note: "" } : i),
    cues, pause: pause || "", kind: "weight", perSide: false, alts: [], note: "", inc: null,
  }, extra);
}
function seg(label, sec, intensity, machine, block, rpe) { return { label, sec, intensity, machine, block, rpe: rpe || "" }; }
function cardioA() {
  return {
    id: "cardioA", type: "cardio", name: "Cardio A", subtitle: "Aerobic base · Bike", color: 3, weekday: 2,
    machines: ["Bike"],
    goal: "Build aerobic capacity and recover faster between BJJ exchanges.",
    progression: "First build toward 45–50 min total. Once that feels comfortable, add resistance or pace while staying around RPE 5–6.",
    cues: ["RPE 5–6: breathing up but controlled", "You can speak in short sentences", "Controlled, consistent pace", "Do NOT turn this into a hard workout"],
    segments: [
      seg("Very easy", 120, E, "Bike", "Warm-up", "3"),

function cardioB() {

    s.push(seg("Moderate", 60, M, m, b, "6"), seg("Hard", 30, H, m, b, "8"), seg("Moderate", 60, M, m, b, "6"),

/* A tap that fails for any reason redraws the screen and says so, instead of leaving the app stuck. */
